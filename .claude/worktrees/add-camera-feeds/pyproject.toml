[project]
name = "planetar-eo"
version = "0.1.0"
description = "Electro-optical (camera-feed) vessel detection + ReID microservice for planetar / CH13 v2"
authors = [{ name = "Steven Ness", email = "sness@sness.net" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "ultralytics>=8.2",
]
streams = [
    "yt-dlp>=2024.4.9",
    "av>=12.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
planetar-eo = "planetar_eo.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planetar_eo = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
